[[env.staging.queues.producers]]
binding = "Q_SIGNALS"
queue = "atb-staging-signal-processing"
[[env.staging.queues.producers]]
binding = "Q_TRADE_EVENTS"
queue = "atb-staging-trade-events"
[[env.staging.queues.producers]]
binding = "Q_NOTIFICATIONS"
queue = "atb-staging-notifications"
[[env.staging.queues.producers]]
binding = "Q_BACKTESTS"
queue = "atb-staging-backtest-jobs"
[[env.staging.queues.producers]]
binding = "Q_MODEL_EVAL"
queue = "atb-staging-model-evaluation"
[[env.staging.queues.producers]]
binding = "Q_ANALYTICS"
queue = "atb-staging-analytics-jobs"

[[env.staging.queues.consumers]]
queue = "atb-staging-trade-events"
max_batch_size = 10
max_retries = 5
dead_letter_queue = "atb-staging-dlq"
[[env.staging.queues.consumers]]
queue = "atb-staging-notifications"
max_batch_size = 10
max_retries = 3
dead_letter_queue = "atb-staging-dlq"
[[env.staging.queues.consumers]]
queue = "atb-staging-signal-processing"
max_batch_size = 5
max_retries = 2
dead_letter_queue = "atb-staging-dlq"

[env.staging.triggers]
crons = ["45 2 * * 1-5", "*/5 3-10 * * 1-5", "30 10 * * 1-5", "30 0 * * *"]

